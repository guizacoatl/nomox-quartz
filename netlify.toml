[build]
  command = "npx quartz build && npx pagefind --site public --output-subdir _pagefind --root-selector \"article.popover-hint\""
  publish = "public"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=8192"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
